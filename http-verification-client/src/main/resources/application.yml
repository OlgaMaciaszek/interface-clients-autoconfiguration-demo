server:
  port: 8080
spring:
  http:
    client:
      service:
        group:
          -verificationClient:
            base-url: lb://verificationClient
  cloud:
    http:
      client:
        service:
          group:
            -verificationClient:
              fallback-class-name: com.example.http.verification.client.fallback.VerificationClientFallbacks
    discovery:
      client:
        simple:
          instances:
            verificationClient:
              - uri: http://localhost:8081
  application:
    name: http-verification-client
logging:
  level:
    org.springframework.boot: DEBUG
