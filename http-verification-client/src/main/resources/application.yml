server:
  port: 8080
spring:
  http:
    client:
      service:
        group:
          -verificationClient:
            base-url: lb://verificationClient
  cloud:
    compatibility-verifier:
      enabled: false
    discovery:
      client:
        simple:
          instances:
            verificationClient:
              - uri: http://localhost:8081
  application:
    name: http-verification-client
